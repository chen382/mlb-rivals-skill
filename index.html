<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MLB 勁旅對決 技能評分計算機（洛年自製）</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #0b1120;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .tier-gold { background: linear-gradient(135deg, #b45309, #f59e0b); color: #fff; }
    .tier-moment { background: linear-gradient(135deg, #047857, #10b981); color: #fff; }
    .tier-glory { background: linear-gradient(135deg, #3b0764, #7e22ce); color: #fff; }
    .tier-hof { background: linear-gradient(135deg, #7f1d1d, #dc2626); color: #fff; }
    .tier-wbc { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen pb-24">

  <!-- 頂部標題與同步狀態 -->
  <header class="bg-slate-900/95 backdrop-blur border-b border-slate-800 sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div>
        <div class="flex flex-wrap items-center gap-2">
          <span class="px-2 py-0.5 text-xs font-bold rounded bg-amber-500/20 text-amber-300 border border-amber-500/40">評分公式參考：臥龍閣-洛年</span>
          <span class="px-2 py-0.5 text-xs font-bold rounded bg-sky-500/20 text-sky-300 border border-sky-500/40">網頁與 App 製作：卑鄙ruth</span>
          <span id="sync-badge" class="px-2 py-0.5 text-[11px] rounded bg-slate-800 text-slate-400 border border-slate-700">內建基準資料</span>
        </div>

        <h1 class="text-lg sm:text-xl font-black tracking-tight text-white mt-1">MLB 勁旅對決 技能評分計算機</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="install-btn" class="hidden px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white shadow">
          安裝 App
        </button>
        <button onclick="manualSync()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-bold" title="重新同步試算表">
          同步更新
        </button>
      </div>
    </div>

    <!-- 計算規則橫幅 -->
    <div class="bg-slate-950/80 border-t border-slate-800/80 px-4 py-2 text-xs text-slate-300">
      <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-x-4 gap-y-1">
        <div>
          <span class="text-amber-400 font-bold">屬性加權：</span>力、準、威、變 <span class="text-white font-bold">×1.0</span> ｜ 選、耐、速、控、持久 <span class="text-white font-bold">×0.5</span>
        </div>
        <div class="text-slate-400">
          發動機率以 MLB 勁旅對決平均機率計算（僅供參考，請自行判斷）
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-4 space-y-5">

    <!-- 主分頁切換 + 定位切換 -->
    <div class="flex flex-col sm:flex-row gap-2 justify-between">
      <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl border border-slate-800 flex-1">
        <button id="tab-calc" onclick="switchTab('calc')" class="py-2 rounded-lg text-sm font-bold bg-blue-600 text-white transition">
          三技組合計算機
        </button>
        <button id="tab-db" onclick="switchTab('db')" class="py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition">
          完整技能評分表
        </button>
      </div>

      <div class="grid grid-cols-2 bg-slate-900 p-1 rounded-xl border border-slate-800 sm:w-56">
        <button id="role-batter" onclick="switchRole('打者')" class="py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 transition">
          打者技能
        </button>
        <button id="role-pitcher" onclick="switchRole('投手')" class="py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition">
          投手技能
        </button>
      </div>
    </div>

    <!-- ==================== 分頁 1：技能組合計算機 ==================== -->
    <section id="view-calc" class="space-y-4">
      <!-- 總分看板 -->
      <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-blue-950/60 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-xl">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">目前組合總評分（<span id="current-role-label">打者</span>）</p>
            <div class="flex items-baseline gap-2 mt-1">
              <span id="total-score" class="text-4xl sm:text-5xl font-black text-amber-400 tabular-nums">0.00</span>
              <span class="text-sm text-slate-400 font-bold">分</span>
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <button onclick="saveComparison()" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-bold shadow">
              + 加入洗技對比
            </button>
            <button onclick="resetSlots()" class="px-4 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold">
              清空欄位
            </button>
          </div>
        </div>
        <div id="slot-summary-pills" class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-800/80 text-xs"></div>
      </div>

      <!-- 3 個技能欄位 -->
      <div id="slots-container" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>

      <!-- 洗技決策對比區 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-sm font-bold text-slate-200">洗技決策對比區（可儲存多組技能比較）</h2>
          <button onclick="clearComparisons()" class="text-xs text-slate-400 hover:text-red-400">全部清除</button>
        </div>
        <div id="comparison-list" class="space-y-2 text-xs text-slate-400">
          尚未儲存對比組合，設定好上方 3 招後點擊「+ 加入洗技對比」。
        </div>
      </div>
    </section>

    <!-- ==================== 分頁 2：完整評分表 ==================== -->
    <section id="view-db" class="hidden space-y-3">
      <!-- 搜尋與篩選列 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 space-y-3">
        <div class="flex flex-col sm:flex-row gap-2">
          <input id="db-search" type="text" oninput="renderDatabase()" placeholder="搜尋技能名稱（例如：王牌、大師、節奏製造者...）"
            class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500" />
          <select id="db-sort" onchange="renderDatabase()" class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200">
            <option value="default">預設排序（原表順序）</option>
            <option value="S">依 S 階分數高→低</option>
            <option value="S1">依 S1 階分數高→低</option>
            <option value="S2">依 S2 階分數高→低</option>
            <option value="S3">依 S3 階分數高→低</option>
            <option value="S4">依 S4 階分數高→低</option>
          </select>
        </div>

        <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5" id="tier-filter-bar"></div>
      </div>

      <!-- 資料表格 -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs sm:text-sm">
            <thead>
              <tr class="bg-slate-950 text-slate-400 border-b border-slate-800">
                <th class="py-2.5 px-3 font-bold">階級</th>
                <th class="py-2.5 px-3 font-bold">技能名稱</th>
                <th class="py-2.5 px-2 text-right font-bold">S</th>
                <th class="py-2.5 px-2 text-right font-bold">S1</th>
                <th class="py-2.5 px-2 text-right font-bold">S2</th>
                <th class="py-2.5 px-2 text-right font-bold">S3</th>
                <th class="py-2.5 px-2 text-right font-bold">S4</th>
                <th class="py-2.5 px-3 text-center font-bold">操作</th>
              </tr>
            </thead>
            <tbody id="db-table-body" class="divide-y divide-slate-800/70"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

    const TIERS = ['金技', 'Moment綠技', '耀黑技能', 'HOF紅技', 'WBC藍技'];
    const TIER_BADGE = {
      '金技': 'tier-gold',
      'Moment綠技': 'tier-moment',
      '耀黑技能': 'tier-glory',
      'HOF紅技': 'tier-hof',
      'WBC藍技': 'tier-wbc'
    };

    // 初始化
    window.addEventListener('DOMContentLoaded', () => {
      const cachedCsv = localStorage.getItem('mlb_skills_csv');
      if (cachedCsv) {
        applyCsvData(cachedCsv, '離線快取資料');
      }
      if (GOOGLE_SHEET_CSV_URL) {
        syncFromGoogleSheet();
      }
      renderTierFilters();
      renderSlots();
      renderDatabase();
    });

    // Google 試算表同步
    async function syncFromGoogleSheet() {
      if (!GOOGLE_SHEET_CSV_URL) return;
      const badge = document.getElementById('sync-badge');
      badge.textContent = '同步中...';
      try {
        const res = await fetch(GOOGLE_SHEET_CSV_URL + '&t=' + Date.now());
        if (!res.ok) throw new Error('網路回應錯誤');
        const text = await res.text();
        localStorage.setItem('mlb_skills_csv', text);
        applyCsvData(text, '雲端試算表已同步');
      } catch (e) {
        badge.textContent = '離線/基準資料';
      }
    }

    function manualSync() {
      if (!GOOGLE_SHEET_CSV_URL) {
        alert('目前使用內建完整資料庫。\n若要啟用雲端自動更新，請在 index.html 填入你的 Google 試算表 CSV 網址。');
        return;
      }
      syncFromGoogleSheet();
    }

    function parseCsvLine(line) {
      const result = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') inQuotes = !inQuotes;
        else if (ch === ',' && !inQuotes) { result.push(cur.trim()); cur = ''; }
        else cur += ch;
      }
      result.push(cur.trim());
      return result;
    }

    function applyCsvData(csvText, statusLabel) {
      const lines = csvText.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) return;
      const parsed = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCsvLine(lines[i]);
        if (cols.length < 4 || !cols[2]) continue;
        const scores = {};
        const gradeKeys = ['S', 'S1', 'S2', 'S3', 'S4'];
        gradeKeys.forEach((g, idx) => {
          const val = parseFloat(cols[3 + idx]);
          if (!isNaN(val)) scores[g] = val;
        });
        if (cols[8]) {
          cols[8].split(',').forEach(pair => {
            const [k, v] = pair.split(':');
            if (k && !isNaN(parseFloat(v))) scores[k.trim()] = parseFloat(v);
          });
        }
        parsed.push({
          role: cols[0] || '打者',
          tier: cols[1] || '金技',
          name: cols[2],
          scores,
          note: cols[9] || '',
          highlight: (cols[10] || '').toUpperCase() === 'TRUE'
        });
      }
      if (parsed.length > 0) {
        allSkills = parsed;
        document.getElementById('sync-badge').textContent = statusLabel;
        document.getElementById('sync-badge').className = 'px-2 py-0.5 text-[11px] rounded bg-emerald-950 text-emerald-300 border border-emerald-700';
        renderSlots();
        renderDatabase();
      }
    }

    // 分頁與定位切換
    function switchTab(tab) {
      document.getElementById('view-calc').classList.toggle('hidden', tab !== 'calc');
      document.getElementById('view-db').classList.toggle('hidden', tab !== 'db');
      document.getElementById('tab-calc').className = tab === 'calc'
        ? 'py-2 rounded-lg text-sm font-bold bg-blue-600 text-white transition'
        : 'py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition';
      document.getElementById('tab-db').className = tab === 'db'
        ? 'py-2 rounded-lg text-sm font-bold bg-blue-600 text-white transition'
        : 'py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition';
    }

    function switchRole(role) {
      currentRole = role;
      document.getElementById('current-role-label').textContent = role;
      document.getElementById('role-batter').className = role === '打者'
        ? 'py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 transition'
        : 'py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition';
      document.getElementById('role-pitcher').className = role === '投手'
        ? 'py-2 rounded-lg text-sm font-bold bg-amber-500 text-slate-950 transition'
        : 'py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white transition';
      slots = [
        { tier: '金技', name: '', grade: 'S' },
        { tier: '金技', name: '', grade: 'S' },
        { tier: '金技', name: '', grade: 'S' }
      ];
      renderSlots();
      renderDatabase();
    }

    // 渲染 3 個技能計算欄位
    function renderSlots() {
      const container = document.getElementById('slots-container');
      container.innerHTML = '';

      slots.forEach((slot, idx) => {
        const tierSkills = allSkills.filter(s => s.role === currentRole && s.tier === slot.tier);
        const selectedSkill = tierSkills.find(s => s.name === slot.name);
        const availableGrades = selectedSkill ? Object.keys(selectedSkill.scores) : ['S', 'S1', 'S2', 'S3', 'S4'];
        if (selectedSkill && !availableGrades.includes(slot.grade)) {
          slot.grade = availableGrades[0];
        }
        const scoreVal = selectedSkill ? (selectedSkill.scores[slot.grade] ?? 0) : 0;

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex flex-col justify-between space-y-3';
        card.innerHTML = `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-slate-400">技能欄 #${idx + 1}</span>
              <span class="text-base font-black text-amber-400 tabular-nums">${scoreVal.toFixed(2)} 分</span>
            </div>

            <!-- 階級選擇 -->
            <div class="grid grid-cols-5 gap-1">
              ${TIERS.map(t => `
                <button onclick="updateSlotTier(${idx}, '${t}')"
                  class="py-1 rounded text-[11px] font-bold border transition ${slot.tier === t
                    ? TIER_BADGE[t] + ' border-white/40 shadow'
                    : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'}">
                  ${t.replace('Moment', 'M').replace('技能', '').replace('技', '')}
                </button>
              `).join('')}
            </div>

            <!-- 技能下拉選單 -->
            <select onchange="updateSlotSkill(${idx}, this.value)"
              class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
              <option value="">-- 選擇${slot.tier} --</option>
              ${tierSkills.map(s => `
                <option value="${s.name}" ${s.name === slot.name ? 'selected' : ''}>
                  ${s.name} (S:${s.scores.S})
                </option>
              `).join('')}
            </select>
          </div>

          <!-- 階級按鈕 -->
          <div class="space-y-1.5">
            <div class="flex flex-wrap gap-1.5">
              ${availableGrades.map(g => `
                <button onclick="updateSlotGrade(${idx}, '${g}')"
                  class="px-2.5 py-1 rounded-lg text-xs font-bold border transition ${slot.grade === g && selectedSkill
                    ? 'bg-blue-600 border-blue-400 text-white'
                    : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'}">
                  ${g}
                </button>
              `).join('')}
            </div>
            ${selectedSkill?.note ? `<p class="text-[11px] text-rose-400 font-medium">${selectedSkill.note}</p>` : ''}
          </div>
        `;
        container.appendChild(card);
      });

      updateTotalScore();
    }

    function updateSlotTier(idx, tier) {
      slots[idx] = { tier, name: '', grade: 'S' };
      renderSlots();
    }

    function updateSlotSkill(idx, name) {
      slots[idx].name = name;
      slots[idx].grade = 'S';
      renderSlots();
    }

    function updateSlotGrade(idx, grade) {
      slots[idx].grade = grade;
      renderSlots();
    }

    function resetSlots() {
      slots = [
        { tier: '金技', name: '', grade: 'S' },
        { tier: '金技', name: '', grade: 'S' },
        { tier: '金技', name: '', grade: 'S' }
      ];
      renderSlots();
    }

    function updateTotalScore() {
      let total = 0;
      const pills = document.getElementById('slot-summary-pills');
      pills.innerHTML = '';

      slots.forEach((slot, idx) => {
        const sk = allSkills.find(s => s.role === currentRole && s.tier === slot.tier && s.name === slot.name);
        const val = sk ? (sk.scores[slot.grade] ?? 0) : 0;
        total += val;
        pills.innerHTML += `
          <div class="bg-slate-950/80 border border-slate-800 rounded-lg px-2.5 py-1.5 truncate">
            <span class="text-slate-500">#${idx + 1}</span>
            <span class="text-slate-200 font-bold ml-1">${sk ? `${sk.name} (${slot.grade})` : '未選'}</span>
          </div>
        `;
      });

      document.getElementById('total-score').textContent = total.toFixed(2);
    }

    // 洗技對比區
    function saveComparison() {
      let total = 0;
      const details = slots.map(slot => {
        const sk = allSkills.find(s => s.role === currentRole && s.tier === slot.tier && s.name === slot.name);
        const val = sk ? (sk.scores[slot.grade] ?? 0) : 0;
        total += val;
        return sk ? `${sk.name}[${slot.grade}]` : '空';
      });
      if (total === 0) return;
      comparisons.unshift({ role: currentRole, total, text: details.join(' + ') });
      renderComparisons();
    }

    function clearComparisons() {
      comparisons = [];
      renderComparisons();
    }

    function renderComparisons() {
      const list = document.getElementById('comparison-list');
      if (comparisons.length === 0) {
        list.innerHTML = '尚未儲存對比組合，設定好上方 3 招後點擊「+ 加入洗技對比」。';
        return;
      }
      const maxScore = Math.max(...comparisons.map(c => c.total));
      list.innerHTML = comparisons.map((c, i) => `
        <div class="flex items-center justify-between p-2.5 rounded-xl border ${c.total === maxScore
          ? 'bg-amber-500/10 border-amber-500/50 text-amber-200'
          : 'bg-slate-950 border-slate-800 text-slate-300'}">
          <div class="truncate pr-2">
            <span class="px-1.5 py-0.5 rounded text-[10px] bg-slate-800 text-slate-300 mr-1.5">${c.role}</span>
            <span class="font-bold">${c.text}</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-sm font-black ${c.total === maxScore ? 'text-amber-400' : 'text-white'} tabular-nums">${c.total.toFixed(2)} 分</span>
            <button onclick="comparisons.splice(${i},1);renderComparisons()" class="text-slate-500 hover:text-rose-400">&times;</button>
          </div>
        </div>
      `).join('');
    }

    // 資料庫篩選與渲染
    function renderTierFilters() {
      const bar = document.getElementById('tier-filter-bar');
      const items = ['全部', ...TIERS];
      bar.innerHTML = items.map(t => `
        <button onclick="currentDbTier='${t}';renderTierFilters();renderDatabase()"
          class="px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 border transition ${currentDbTier === t
            ? 'bg-blue-600 border-blue-400 text-white'
            : 'bg-slate-950 border-slate-800 text-slate-400 hover:text-white'}">
          ${t}
        </button>
      `).join('');
    }

    function renderDatabase() {
      const keyword = document.getElementById('db-search').value.trim().toLowerCase();
      const sortBy = document.getElementById('db-sort').value;

      let filtered = allSkills.filter(s => {
        if (s.role !== currentRole) return false;
        if (currentDbTier !== '全部' && s.tier !== currentDbTier) return false;
        if (keyword && !s.name.toLowerCase().includes(keyword)) return false;
        return true;
      });

      if (sortBy !== 'default') {
        filtered = [...filtered].sort((a, b) => (b.scores[sortBy] ?? -1) - (a.scores[sortBy] ?? -1));
      }

      const tbody = document.getElementById('db-table-body');
      tbody.innerHTML = filtered.map(s => `
        <tr class="hover:bg-slate-800/40 transition">
          <td class="py-2.5 px-3 whitespace-nowrap">
            <span class="px-2 py-0.5 rounded text-[11px] font-bold ${TIER_BADGE[s.tier] || 'bg-slate-700'}">${s.tier}</span>
          </td>
          <td class="py-2.5 px-3">
            <div class="font-bold ${s.highlight ? 'text-rose-400' : 'text-slate-100'}">${s.name}</div>
            ${s.note ? `<div class="text-[11px] text-rose-400/90">${s.note}</div>` : ''}
          </td>
          <td class="py-2.5 px-2 text-right font-mono font-bold text-slate-200">${s.scores.S ?? '-'}</td>
          <td class="py-2.5 px-2 text-right font-mono text-slate-300">${s.scores.S1 ?? '-'}</td>
          <td class="py-2.5 px-2 text-right font-mono text-slate-300">${s.scores.S2 ?? '-'}</td>
          <td class="py-2.5 px-2 text-right font-mono text-slate-300">${s.scores.S3 ?? '-'}</td>
          <td class="py-2.5 px-2 text-right font-mono text-slate-300">${s.scores.S4 ?? '-'}</td>
          <td class="py-2.5 px-3 text-center whitespace-nowrap">
            <button onclick="sendToCalc('${s.tier}', '${s.name.replace(/'/g, "\\'")}')"
              class="px-2.5 py-1 rounded-lg bg-blue-600/20 hover:bg-blue-600 text-blue-300 hover:text-white border border-blue-500/40 text-xs font-bold transition">
              + 試算
            </button>
          </td>
        </tr>
      `).join('');
    }

    function sendToCalc(tier, name) {
      let targetIdx = slots.findIndex(s => !s.name);
      if (targetIdx === -1) targetIdx = 0;
      slots[targetIdx] = { tier, name, grade: 'S' };
      switchTab('calc');
      renderSlots();
    }

    // PWA Service Worker 註冊與安裝按鈕提示
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('install-btn');
      btn.classList.remove('hidden');
      btn.onclick = async () => {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        btn.classList.add('hidden');
        deferredPrompt = null;
      };
    });
  </script>
</body>
</html>
